services:
  api:
    image: ghcr.io/example/api:2.3
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3004/_readiness').then(r => { if (!r.ok) process.exit(1)
          }).catch(() => process.exit(1))",
        ]
      interval: 5s
  other:
    image: example/other:1   # after the wrapped string
